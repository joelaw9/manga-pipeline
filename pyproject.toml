[project]
name = "manga_pipeline"
version = "0.1.0"
description = "Suwayomi to Kavita manga pipeline: junk removal, metadata, bad-download repair, AVIF conversion"
requires-python = ">=3.13"

# No packaging: install with `python -m pip install --group dev` (pip 25.1+).
[dependency-groups]
# Exact pins: every machine of the fleet runs the same versions (SPEC "State"; Pillow and numpy change junk scans).
# scipy (imagehash's phash), opencv-python-headless, pyclipper and shapely (rapidocr) are pinned for what they change.
runtime = ["pyyaml==6.0.3", "pillow==13.0.0", "numpy==2.5.4", "imagehash==4.3.2", "rapidfuzz==3.14.6", "markdown-it-py==4.2.0", "rapidocr==3.10.0", "psycopg[binary]==3.3.9", "scipy==1.18.0", "opencv-python-headless==5.0.0.93", "pyclipper==1.4.0", "shapely==2.2.0"]
# OCR needs exactly 1 onnxruntime: dev takes DirectML on Windows and the CPU build elsewhere (CI); the LXC installs
# --group runtime --group ocr-cuda (junk.ocr_device cuda).
ocr-cuda = ["onnxruntime-gpu[cuda,cudnn]"]
dev = [
    { include-group = "runtime" },
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
    "pytest",
    "pytest-testmon",
    "pytest-xdist",
    "hypothesis",
    "coverage",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["tests/timing.py"]  # copied from the unit-tests skill; kept as shipped

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-local-folder = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
