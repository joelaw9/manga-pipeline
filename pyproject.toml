[project]
name = "manga_pipeline"
version = "0.1.0"
description = "Suwayomi to Kavita manga pipeline: junk removal, metadata, bad-download repair, AVIF conversion"
requires-python = ">=3.13"

# No packaging: install with `python -m pip install --group dev` (pip 25.1+).
[dependency-groups]
# Exact pins: every machine of the fleet runs the same versions (SPEC "State"; Pillow and numpy change junk scans).
# scipy (imagehash's phash), opencv-python-headless, pyclipper and shapely (rapidocr) are pinned for what they change.
runtime = ["pyyaml==6.0.3", "pillow==13.0.0", "numpy==2.5.4", "imagehash==4.3.2", "rapidfuzz==3.14.6", "markdown-it-py==4.2.0", "rapidocr==3.10.0", "psycopg[binary]==3.3.9", "scipy==1.18.0", "opencv-python-headless==5.0.0.93", "pyclipper==1.4.0", "shapely==2.2.0"]
# OCR needs exactly 1 onnxruntime: dev takes DirectML on Windows and the CPU build elsewhere (CI); the LXC installs
# --group runtime --group ocr-cuda (junk.ocr_device cuda).
ocr-cuda = ["onnxruntime-gpu[cuda,cudnn]"]
dev = [
    { include-group = "runtime" },
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
    "pytest",
    "pytest-testmon",
    "pytest-xdist",
    "hypothesis",
    "xmlschema",
    "coverage>=7.10",  # [tool.coverage.run] patch = ["subprocess"]
    # Exact pins: select = ["ALL"] takes in every rule a new ruff release adds; upgrading is a deliberate change.
    "ruff==0.17.3",
    # A bump compares [tool.basedpyright]'s second environment with the new version's strict set (its list mirrors 1.40.2's).
    "basedpyright==1.40.2",
    # Exact pins, as ruff's: a new release can add findings.
    "import-linter==2.16",
    "vulture==2.16",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",                        # not used
    "COM812", "COM819", "ISC001", "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003",  # the formatter's job
    "D203", "D213",               # incompatible with D211 / D212, which are kept (ruff must drop 1 of each pair)
    "S603",                       # every subprocess call is list-form with runtime arguments, no shell
    "TRY004",                     # every isinstance check validates a parsed YAML file: a value error, not a type error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311", "ANN"]           # pytest asserts; literal expectations and test data; seeded data; tests are not annotated
"tests/test_*.py" = ["D103"]                              # a test's name is its statement
"tests/fakes/**" = ["D1"]                                 # a fake imitates a documented real class
"manga_pipeline/cli.py" = ["T201"]                        # printing is this module's job: a command's own output
"tests/fake_claude.py" = ["T201"]                         # a fake CLI whose stdout is its result
# xml.etree on expat >= 2.4.1 resists entity expansion and resolves no external entity. Per file, not a noqa at each of
# its 5 parses: the file is part of rewrite.CODE, so a comment in it would compare every series again.
"manga_pipeline/comicinfo.py" = ["S314"]

[tool.ruff.lint.isort]
known-local-folder = ["tests"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
pythonPlatform = "Windows"  # CI's platform; CI and the merge hook also run --pythonplatform Linux (the LXC)
include = ["manga_pipeline", "tests", "scripts"]

# The program and scripts/ are held to strict mode's settings but 2 (CLAUDE.md, Types); tests stay basic. The first
# root that holds a file decides its rules, so tests comes first and "." takes the rest; each environment needs
# extraPaths to import the package. An environment cannot set typeCheckingMode, and a `strict` path cannot relax a
# rule, so the second environment lists every setting basedpyright 1.40.2's strict mode changes from basic, less:
# - reportUnnecessaryIsInstance (10 hits): 4 are the only type check of a config value config.load does not check
#   (database.password and notify.discord_webhook, whose example is null; the items of series.only and
#   paths.kavita_path_map, whose example is empty). Reopened by the next change to config._check, the Config types,
#   metadata/importer.py's 2 readers or the stage-outcome guard in workflow.work.
# - reportMissingTypeStubs (2 hits): onnxruntime ships no stubs. Reopened by the next change of the onnxruntime or
#   basedpyright pin.
# reportExplicitAny is basedpyright's own, not part of strict.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]

[[tool.basedpyright.executionEnvironments]]
root = "."
extraPaths = ["."]
strictListInference = true
strictSetInference = true
strictDictionaryInference = true
reportAssertAlwaysTrue = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportDuplicateImport = "error"
reportFunctionMemberAccess = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportIncompleteStub = "error"
reportInconsistentConstructor = "error"
reportInvalidStringEscapeSequence = "error"
reportInvalidStubStatement = "error"
reportInvalidTypeVarUse = "error"
reportMatchNotExhaustive = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportOverlappingOverload = "error"
reportPossiblyUnboundVariable = "error"
reportPrivateUsage = "error"
reportSelfClsParameterName = "error"
reportTypeCommentUsage = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnsupportedDunderAll = "error"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportUnusedClass = "error"
reportUnusedExpression = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportWildcardImportFromLibrary = "error"
reportExplicitAny = "error"

# Import rules (lint-imports --no-cache): each contract encodes a rule CLAUDE.md or SPEC states. A new contract or
# ignore_imports entry needs the user's approval, as a noqa does. The ignore_imports of C3 and C4 name the 1 module each
# rule allows, so they are the rule itself.
[tool.importlinter]
root_packages = ["manga_pipeline", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "C1: a client never imports workflow, a stage or a part"
type = "forbidden"
source_modules = ["manga_pipeline.clients"]
forbidden_modules = [
    "manga_pipeline.workflow",
    "manga_pipeline.stages",
    "manga_pipeline.intake",
    "manga_pipeline.process",
    "manga_pipeline.export",
    "manga_pipeline.cli",
]

[[tool.importlinter.contracts]]
name = "C2: the test fakes import the clients, never a part, a stage or workflow (direct imports)"
type = "forbidden"
source_modules = ["tests.fakes"]
forbidden_modules = [
    "manga_pipeline.workflow",
    "manga_pipeline.stages",
    "manga_pipeline.intake",
    "manga_pipeline.process",
    "manga_pipeline.export",
    "manga_pipeline.cli",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "C3: only db imports psycopg"
type = "forbidden"
source_modules = ["manga_pipeline"]
forbidden_modules = ["psycopg"]
ignore_imports = ["manga_pipeline.db -> psycopg"]

[[tool.importlinter.contracts]]
name = "C4: only the entry point sets up logging"
type = "forbidden"
source_modules = ["manga_pipeline"]
forbidden_modules = ["manga_pipeline.logs"]
ignore_imports = ["manga_pipeline.cli -> manga_pipeline.logs"]

[[tool.importlinter.contracts]]
name = "C5: nothing in the program imports the entry point"
type = "forbidden"
source_modules = ["manga_pipeline"]
forbidden_modules = ["manga_pipeline.cli"]

[[tool.importlinter.contracts]]
name = "C6: the 3 parts are independent"
type = "independence"
modules = ["manga_pipeline.intake", "manga_pipeline.process", "manga_pipeline.export"]

[[tool.importlinter.contracts]]
name = "C7: dependencies point one direction"
type = "layers"
layers = [
    "manga_pipeline.cli",
    "manga_pipeline.intake | manga_pipeline.process | manga_pipeline.export",
    "manga_pipeline.stages",
    "manga_pipeline.workflow",
    "manga_pipeline.db",
    "manga_pipeline.clients",
    "manga_pipeline.errors",
]

[[tool.importlinter.contracts]]
name = "C8: a stage uses the run's clients and never builds its own (direct imports)"
type = "forbidden"
source_modules = ["manga_pipeline.stages"]
forbidden_modules = ["manga_pipeline.clients"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "C9: the pure metadata modules touch no database, service or workflow"
type = "forbidden"
source_modules = [
    "manga_pipeline.metadata.ids",
    "manga_pipeline.metadata.episodes",
    "manga_pipeline.metadata.platforms",
    "manga_pipeline.metadata.tags",
    "manga_pipeline.metadata.rewrite_plan",
]
forbidden_modules = [
    "manga_pipeline.db",
    "manga_pipeline.clients",
    "manga_pipeline.workflow",
    "manga_pipeline.metadata.sources",
    "psycopg",
]

# Dead code (python scripts/vulture_check.py): program code must be used by the program, so tests are not scanned.
# Unused names are 60% findings; a higher threshold keeps only kinds ruff's F401 and ARG already check. Each
# ignore_names entry is a use vulture cannot see, approved by the user; a new one needs the user's approval.
[tool.vulture]
paths = ["manga_pipeline"]
min_confidence = 60
ignore_names = [
    "handle_starttag",  # HTMLParser calls them (metadata/merge.py, metadata/sources.py)
    "handle_endtag",
    "handle_data",
    "create_system",  # zipfile.ZipInfo attributes ZipFile.writestr reads (archive.py)
    "external_attr",
    "MAX_IMAGE_PIXELS",  # Pillow's module setting (images.py)
    "collections",  # Kavita.collections and collection_series: used only by scripts/queue_first.py
    "collection_series",
]
# TypedDict fields are read by key, which vulture cannot see: scripts/vulture_check.py drops the findings on them.

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["manga_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
