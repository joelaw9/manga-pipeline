[project]
name = "manga_pipeline"
version = "0.1.0"
description = "Suwayomi to Kavita manga pipeline: junk removal, metadata, bad-download repair, AVIF conversion"
requires-python = ">=3.13"

# No packaging: install with `python -m pip install --group dev` (pip 25.1+).
[dependency-groups]
# Exact pins: every machine of the fleet runs the same versions (SPEC "State"; Pillow and numpy change junk scans).
# scipy (imagehash's phash), opencv-python-headless, pyclipper and shapely (rapidocr) are pinned for what they change.
runtime = ["pyyaml==6.0.3", "pillow==13.0.0", "numpy==2.5.4", "imagehash==4.3.2", "rapidfuzz==3.14.6", "markdown-it-py==4.2.0", "rapidocr==3.10.0", "psycopg[binary]==3.3.9", "scipy==1.18.0", "opencv-python-headless==5.0.0.93", "pyclipper==1.4.0", "shapely==2.2.0"]
# OCR needs exactly 1 onnxruntime: dev takes DirectML on Windows and the CPU build elsewhere (CI); the LXC installs
# --group runtime --group ocr-cuda (junk.ocr_device cuda).
ocr-cuda = ["onnxruntime-gpu[cuda,cudnn]"]
dev = [
    { include-group = "runtime" },
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
    "pytest",
    "pytest-testmon",
    "pytest-xdist",
    "hypothesis",
    "xmlschema",
    "coverage>=7.10",  # [tool.coverage.run] patch = ["subprocess"]
    # Exact pins: select = ["ALL"] takes in every rule a new ruff release adds; upgrading is a deliberate change.
    "ruff==0.17.3",
    "basedpyright==1.40.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM", "CPY", "ANN",          # not used (ANN: to revisit once basedpyright is in)
    "ISC001", "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003",  # the formatter's job
    "D203", "D213",               # incompatible with D211 / D212, which are kept (ruff must drop 1 of each pair)
    "BLE001",                     # every catch-all is deliberate: a stage, row or check boundary, or Pillow's many errors
    "S603",                       # every subprocess call is list-form with runtime arguments, no shell
    "S310",                       # Service.request refuses a URL that is not http or https before opening it
    "S314",                       # xml.etree on expat >= 2.4.1 resists entity expansion and resolves no external entity
    "TRY004",                     # every isinstance check validates a parsed YAML file: a value error, not a type error
    "S105",                       # every hit is a false positive (a meta key name; a fake test token)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311"]                  # pytest asserts; literal expectations and test data; seeded data
"tests/test_*.py" = ["D103"]                              # a test's name is its statement
"tests/fakes/**" = ["D1"]                                 # a fake imitates a documented real class
"manga_pipeline/{cli,smoke,status}.py" = ["T201"]         # printing is these modules' job: a command's own output
"manga_pipeline/metadata/audit.py" = ["T201"]
"tests/fake_claude.py" = ["T201"]                         # a fake CLI whose stdout is its result

[tool.ruff.lint.isort]
known-local-folder = ["tests"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
pythonPlatform = "Windows"  # CI's platform; CI and the merge hook also run --pythonplatform Linux (the LXC)
include = ["manga_pipeline", "tests"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["manga_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
