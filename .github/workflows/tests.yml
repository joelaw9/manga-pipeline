# The checks main's ruleset requires on every PR (.github/rulesets/main.json): the tests job (lint, format, types, import
# contracts (lint-imports), dead code (vulture), the full test suite, on Windows) and the tests-linux job (the full test
# suite on Linux). The audit job (pip-audit: known vulnerabilities in the installed packages) is not required, so an
# advisory-service outage blocks no merge; it also runs weekly, since advisories land against pins already merged.
name: tests
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  tests:
    name: tests
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      # The tests' database server (SPEC "Tests"): the runner's own PostgreSQL 17, which ships stopped and disabled.
      # A throwaway server, so durability is off; mp_test logs in from the runner without a password.
      - name: PostgreSQL 17 for the tests
        shell: pwsh
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          $hba = Join-Path $env:PGDATA "pg_hba.conf"
          $trust = @("host all mp_test 127.0.0.1/32 trust", "host all mp_test ::1/128 trust")
          Set-Content -Path $hba -Encoding ascii -Value ($trust + (Get-Content $hba))
          & "$env:PGBIN\psql" -h localhost -d postgres -v ON_ERROR_STOP=1 `
            -c "ALTER SYSTEM SET max_connections = 300" -c "ALTER SYSTEM SET fsync = off" `
            -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Restart-Service postgresql-x64-17
          & "$env:PGBIN\psql" -h localhost -d postgres -v ON_ERROR_STOP=1 `
            -c "CREATE ROLE mp_test LOGIN CREATEDB PASSWORD 'mp_test'"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m basedpyright --warnings
      - run: python -m basedpyright --warnings --pythonplatform Linux
      - run: lint-imports --no-cache
      - run: python scripts/vulture_check.py
      - run: python -m pytest -q -n auto
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: python -m pip_audit --strict
  # The same suite on Linux (the program also runs on the LXC). Required by main's ruleset, as the tests job is.
  # The database server is a throwaway container, so durability is off. The suite takes about 4 minutes here; the
  # timeout ends a hung run.
  tests-linux:
    name: tests-linux
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      # pg_isready runs over TCP: the image's init-time server listens on the Unix socket only, so a socket check can pass early.
      - name: PostgreSQL 17 for the tests
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17 -c max_connections=300 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres && exit 0 || sleep 1
          done
          echo "PostgreSQL did not come up within 60 s" >&2
          docker logs pg
          exit 1
      - run: docker exec pg psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE mp_test LOGIN CREATEDB PASSWORD 'mp_test'"
      - run: python -m pytest -q -n auto -rfEs
