# Test copy of config.yaml: same keys as config.yaml.example. "$TMP/..." values land in the test run's temp dir.

logging:
  dir: "$TMP/logs"
  level: "DEBUG"
  keep_days: 14

lock:
  enabled: true
  dir: "$TMP/locks"

preflight:
  min_free_mb: 0

database:
  path: "$TMP/pipeline.sqlite3"

paths:
  downloads: "$TMP/share/downloads"
  library: "$TMP/share/library"
  staging: "$TMP/share/staging"
  scratch: "$TMP/scratch"

workflow:
  attempt_limit: 3

series:
  only: []
