# Test copy of config.yaml: same keys as config.yaml.example. "$TMP/..." values land in the test run's temp dir.

logging:
  dir: "$TMP/logs"
  level: "DEBUG"
  keep_days: 14

lock:
  enabled: true

preflight:
  min_free_mb: 0
  min_share_free_mb: 0

database:
  # The test role exists only on the developer's and CI's servers (SPEC "Tests"); its password protects nothing.
  # site_cfg sets each test's own database name; this one is never built.
  host: "localhost"
  port: 5432
  name: "mp_test_unassigned"
  user: "mp_test"
  password: "mp_test"

paths:
  downloads: "$TMP/share/downloads"
  library: "$TMP/share/library"
  staging: "$TMP/share/staging"
  retention: "$TMP/share/retention"
  scratch: "$TMP/scratch"
  covers: "$TMP/covers"
  candidates: "$TMP/candidates"
  naming_overrides: "$TMP/overrides"
  kavita_path_map: {"/kavita": "$TMP/share"}

workflow:
  attempt_limit: 3

intake:
  settle_minutes: 5

series:
  only: []

suwayomi:
  url: "http://suwayomi.invalid"

kavita:
  url: "http://kavita.invalid"
  api_key: "test-key"
  library_id: 4
  rescan_after_minutes: 60

metadata:
  checks_per_run: 25    # metadata checks per intake run beyond those a new chapter made due and first checks
  recent_months: 6      # a series updated within this many months is checked every recent_days
  complete_months: 12   # a complete series not updated for this many months is checked every complete_days
  recent_days: 7
  quiet_days: 30        # every other series
  complete_days: 365

export:
  retention_days: 7
  rewrites_open: 50

notify:
  discord_webhook: null

tools:
  avifenc: "$TMP/tools/avifenc"
  avifdec: "$TMP/tools/avifdec"
  jpegtran: "$TMP/tools/jpegtran"
  oxipng: "$TMP/tools/oxipng"
  vship: "$TMP/tools/vship"

convert:
  workers: 2
  min_scratch_free_mb: 0

sources:
  ranking: []
  download_timeout_hours: 24

validate:
  non_chapter_names: []

junk:
  claude_token: "test-token"
  claude_path: "claude"
  review_limit: 2
  review_batch: 20
  ocr_device: "cpu"
  keywords: [repost, discord, scans, scanlat, translat, typeset, proofread, clean, redraw, read on, support us, patreon, ko-fi, paypal, gg/, join us, join our, raw provider, recruit, official domain, fastest, uploading, protected by copyright, protected under copyright, copyright law, unauthorized reproduction, unauthorized distribution, .com, .net, .org, .io]
  weak: [.com, .net, .org, .io, scans]
  paired: [clean]
  suppress: [linguist, all rights reserved, published under license, kidaristudio, d&c media, head of localization, localization produced by, tapas media, crisis text line, localization manager, primary qc, secondary qc]
